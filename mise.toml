"brew-cask:signal" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:wireshark-app" = "latest"
"brew-cask:yubico-authenticator" = "latest"
# yubico-yubikey-manager: removed from homebrew-cask (404 in the formulae.brew.sh API); the installed copy is left alone, reinstall from yubico.com if needed.
"brew-cask:zed" = "latest"
