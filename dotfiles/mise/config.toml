# Global mise config, deployed to ~/.config/mise/config.toml by [dotfiles] in the repo's mise.toml.
# mise owns every CLI/runtime that has a working arm64 backend. Homebrew (driven by
# [bootstrap.packages] in the repo's mise.toml) is reduced to casks (GUI apps; mise has no
# .app/.dmg/.pkg backend) and nine formulae that mise cannot install as prebuilt binaries.
# Each tool lives in exactly one place.
#
# Backend order used: registry short name (aqua/core) -> aqua:/github: -> go:/npm: -> conda:.
# - conda: (conda-forge, osx-arm64) is used for native tools with no release binaries.
#   It is an experimental mise backend, hence `experimental = true`.
# - github:/aqua: tools download release binaries; the xpack toolchains are the arm64 builds.
# - Notes: redis/podman are plain binaries (no launchd service; `brew services` does not
#   manage them). Verified with an isolated mise on macOS arm64 (see docs/MIGRATION.md).

[settings]
experimental = true

[tools]
# ---- Runtimes ----
go = "latest"
node = "latest"
python = "latest"
uv = "latest"
starship = "latest"      # prompt (branch + git status); config in dotfiles/starship.toml
rust = "latest"
zig = "latest"
java = "temurin-21"      # required by gradle, kotlin, maven, openapi-generator

# ---- Dev CLIs (registry/aqua) ----
aws-cli = "latest"
gh = "latest"            # git credential helper uses the mise shim path (see dot_gitconfig.tmpl)
jq = "latest"
yq = "latest"
buf = "latest"
goreleaser = "latest"
hugo = "latest"          # >= 0.170 ships a single binary (extended edition and LibSass removed; SCSS needs Dart Sass installed separately)
"aqua:boyter/scc" = "latest"
opentofu = "latest"
shellcheck = "latest"
direnv = "latest"
bazelisk = "latest"
gradle = "latest"
kotlin = "latest"
maven = "latest"
tinygo = "latest"
glow = "latest"
changie = "latest"
protoc = "latest"
golangci-lint = "latest"
vhs = "latest"
"conda:ttyd" = "latest"            # vhs runtime dependency (mise registry ttyd has no macOS build)
ffmpeg = "latest"                # vhs runtime dependency
rtk = "latest"
herdr = "latest"
worktrunk = "latest"             # provides `wt`
ninja = "latest"
tmux = "latest"
"aqua:uutils/coreutils" = "latest"
"7zip" = "latest"                # provides 7zz
yt-dlp = "latest"

# ---- conda-forge (osx-arm64) ----
"conda:youtube-dl" = "latest"
"conda:poppler" = "latest"
"conda:redis-server" = "latest"
"conda:podman" = "latest"
"conda:exiftool" = "latest"
"conda:automake" = "latest"
"conda:htop" = "latest"
"conda:wget" = "latest"
"conda:watch" = "latest"
"conda:tree" = "latest"
"conda:httpie" = "latest"
"conda:ncdu" = "latest"
"conda:jupyterlab" = "latest"

# ---- github / go / npm backends ----
"github:asciinema/agg" = "latest"
"github:xpack-dev-tools/openocd-xpack" = "latest"
"github:xpack-dev-tools/arm-none-eabi-gcc-xpack" = "latest"
"github:furkankly/zoetrope" = "latest"           # binary is `zoe`
"go:src.techknowlogick.com/xgo" = "latest"
"npm:@openapitools/openapi-generator-cli" = "latest"   # downloads the jar; needs java
